
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceManager — Учёт финансов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>FinanceManager</h1>
        <p>Управление личными финансами</p>

        <div class="input-section">
            <input
                type="text"
                id="transactionInput"
                placeholder="Например, продукты — 1500 руб."
            >
            <button onclick="addTransaction()">Добавить</button>
        </div>

        <ul id="transactionList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
